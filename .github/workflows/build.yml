name: Build installers

# Builds FlowSetup.exe on Windows and a .dmg for each kind of Mac.
# A tag like v1.1.0 also publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup if the image lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build app and installer
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test (app starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process dist\Flow\Flow.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Flow.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          "Flow.exe stayed up for 8 seconds"

      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Windows
          path: dist/FlowSetup.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon: M1 and newer
            label: AppleSilicon
          - runner: macos-15-intel  # Intel Macs
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        # Pillow lets PyInstaller turn the .ico into the .icns a Mac app needs.
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller pillow

      - name: Build Flow.app
        run: python -m PyInstaller --noconfirm --clean Flow.spec

      - name: Report architecture and minimum macOS
        run: |
          file dist/Flow.app/Contents/MacOS/Flow
          qtcore="$(find dist/Flow.app -path '*QtCore.framework/Versions/A/QtCore' -type f | head -1)"
          echo "QtCore: $qtcore"
          archs="$(lipo -archs "$qtcore")"
          minos="$(otool -l "$qtcore" | grep -A4 LC_BUILD_VERSION | awk '/minos/ {print $2; exit}')"
          line="- **${{ matrix.label }}** (\`Flow-macOS-${{ matrix.label }}.dmg\`): macOS $minos or newer, $archs"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "$line" > "macos-${{ matrix.label }}.md"

      - name: Smoke test (app starts and stays up)
        run: |
          dist/Flow.app/Contents/MacOS/Flow &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            echo "Flow stayed up for 10 seconds"
            kill "$pid"
          else
            wait "$pid"; echo "Flow exited early with code $?"; exit 1
          fi

      - name: Shortcut helper (Control-Option-W)
        run: |
          app="$PWD/dist/Flow.app/Contents/MacOS/Flow"
          log=~/Library/Logs/Flow-shortcut.log
          "$app" --setup-shortcut || echo "setup returned $?"
          sleep 6
          launchctl print "gui/$(id -u)/app.flow.wallpapers.shortcut" | grep -E "^\s*(state|pid|last exit code)" || true
          cat "$log" || true
          grep -q "listening for Control-Option-W" "$log"
          # Press the keys if this runner lets scripts type; informational only.
          before=$(pgrep -f "Flow.app/Contents/MacOS/Flow$" | wc -l | tr -d ' ')
          osascript -e 'tell application "System Events" to keystroke "w" using {control down, option down}' \
            || echo "this runner cannot send keystrokes"
          sleep 8
          after=$(pgrep -f "Flow.app/Contents/MacOS/Flow$" | wc -l | tr -d ' ')
          echo "pickers open before the keys: $before, after: $after"
          grep "shortcut pressed" "$log" || echo "no key press reached the helper"
          "$app" --remove-shortcut
          pkill -f "Flow.app/Contents/MacOS/Flow" || true
          test ! -e ~/Library/LaunchAgents/app.flow.wallpapers.shortcut.plist

      - name: Package .dmg
        run: |
          mkdir dmg
          cp -R dist/Flow.app dmg/
          cp LICENSE dmg/LICENSE.txt
          cp THIRD-PARTY-NOTICES.txt dmg/
          cp -R licenses dmg/licenses
          ln -s /Applications dmg/Applications
          # hdiutil on GitHub's Macs sometimes fails with "Resource busy"; a retry clears it.
          for try in 1 2 3 4 5; do
            hdiutil create -volname Flow -srcfolder dmg -ov -format UDZO "Flow-macOS-${{ matrix.label }}.dmg" && break
            if [ "$try" = 5 ]; then exit 1; fi
            echo "hdiutil failed (try $try), retrying"; sleep 10
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Flow-macOS-${{ matrix.label }}
          path: Flow-macOS-${{ matrix.label }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: notes-macos-${{ matrix.label }}
          path: macos-${{ matrix.label }}.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Flow-*
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: notes-*
          path: notes
          merge-multiple: true

      - name: Write release notes
        run: |
          {
            echo "## Downloads"
            echo
            echo "- **Windows 10 / 11**: \`FlowSetup.exe\`"
            cat notes/*.md
            echo
            echo "Not sure which Mac you have? Apple menu > About This Mac shows the chip."
            echo "Install steps for each system are in the README."
          } > body.md

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: body.md
